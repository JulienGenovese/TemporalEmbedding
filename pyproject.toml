[project]
name = "embeddingclient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "numpy==1.24.1",
    "loguru>=0.7.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "tensorboard>=2.20.0",
    "typer>=0.12.5",
    "tomli>=2.2.1; python_version < '3.11'",
    "scikit-learn>=1.7.2",
]

[project.scripts]
py = "cli:main"


[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["cli.py"]
[tool.uv]
package = true
