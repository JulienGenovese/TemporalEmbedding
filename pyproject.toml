[project]
name = "embeddingclient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "numpy>=2.0",
    "loguru>=0.7.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "tensorboard>=2.20.0",
    "torch>=2.11",
    "typer>=0.12.5",
    "scikit-learn>=1.7.2",
]

[project.scripts]
py = "cli:main"

# torch is a CUDA nightly (2.11.0+cu130) installed from the PyTorch nightly index.
# The explicit index keeps it out of default PyPI resolution so `uv sync` won't
# replace the GPU build with the CPU wheel.
[[tool.uv.index]]
name = "pytorch-nightly-cu130"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu130" }


[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["cli.py"]
[tool.uv]
package = true
