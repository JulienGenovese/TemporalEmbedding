[project]
name = "embeddingclient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "numpy>=2.0",
    "loguru>=0.7.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "tensorboard>=2.20.0",
    "torch>=2.12",
    "typer>=0.12.5",
    "scikit-learn>=1.7.2",
]

[project.scripts]
py = "cli:main"

# This machine has no NVIDIA GPU, so torch is pinned to the CPU build from the
# PyTorch CPU index. The explicit index keeps it out of default PyPI resolution
# so `uv sync` won't pull the much larger CUDA wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["cli.py"]
[tool.uv]
package = true
