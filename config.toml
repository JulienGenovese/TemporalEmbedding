[synthetic.simple_spatial]
output = "data/transactions_simple_spatial.csv"
amount_blend_factor = 0.5
seed = 42

[synthetic.simple_delta]
output = "data/transactions_simple_delta.csv"
seed = 42

[synthetic.simple_calendar]
output = "data/transactions_simple_calendar.csv"
seed = 42

[synthetic.timing]
ts_base = 1577836800
ts_range = 126144000
day = 86400

[model.hier_transformer.paths]
train_path = "data/transactions_simple_delta_train.csv"
pred_input_path = "data/transactions_simple_delta_pred.csv"
pred_output_path = "data/output/pred_simple_delta_embeddings.csv"
model_output_dir = "model_artifacts"

[model.hier_transformer.data]
seq_len = 25
pred_windows_per_client = 8
clients_per_batch = 16
train_windows_per_client = 6

[model.hier_transformer.training]
epochs = 30
mask_prob = 0.15
contrastive_weight = 0.5
lr = 0.0003
weight_decay = 0.01
lr_gamma = 0.95
grad_clip = 1.0
val_frac = 0.2
val_every = 1
early_stopping_patience = 5
early_stopping_min_delta = 0.0
log_every = 5

[model.hier_transformer.runtime]
device = "gpu"
seed = 0

[model.hier_transformer.architecture]
d_field = 64
d_model = 128
n_frequencies = 16
field_n_layers = 2
field_n_heads = 4
seq_n_layers = 4
seq_n_heads = 8
dim_feedforward = 512
dropout = 0.1
time_alpha_init = 0.1

[model.hier_transformer.perturbation]
column = ""
output_path = "model_artifacts/simple_delta/perturbation.csv"
classification_output_path = "model_artifacts/classification_perturbation.csv"
classification_test_size = 0.3
classification_max_iter = 1000
classification_n_seeds = 5

[model.plot]
history = "model_artifacts/history.json"
runs_dir = "model_artifacts/tensorboard"